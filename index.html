<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portail Amicial – Mes tableaux de bord</title>
<style>
:root{
  --oregon:#3e5a7f; --mandarine:#f29559; --fougere:#568259; --os:#e3dbc8; --bleuclair:#c7e0e4;
  --bg:#f5f2ea; --card:#ffffff; --text:#1f2a37; --muted:#5d6b7b; --line:#e3dbc8; --shadow:0 1px 3px rgba(31,42,55,.08),0 4px 14px rgba(31,42,55,.06);
  --head:#3e5a7f; --headtext:#fff; --chip:#ece6d8; --input:#fff;
}
[data-theme="dark"]{
  --bg:#141b24; --card:#1d2733; --text:#e8edf2; --muted:#9aa8b8; --line:#2c3a4a; --shadow:0 1px 3px rgba(0,0,0,.4);
  --head:#1d2b3d; --headtext:#e8edf2; --chip:#26323f; --input:#16202b;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--head);color:var(--headtext);padding:18px 28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:4px solid var(--mandarine)}
.logo{width:44px;height:44px;border-radius:12px;background:var(--mandarine);display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;flex:none}
.ttl h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.2px}
.ttl div{font-size:13px;opacity:.8;margin-top:2px}
.hspace{flex:1}
.search{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:9px 12px;color:var(--headtext);min-width:230px;outline:none}
.search::placeholder{color:rgba(255,255,255,.7)}
.hbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:var(--headtext);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.hbtn:hover{background:rgba(255,255,255,.24)}
.hbtn.on{background:var(--mandarine);border-color:var(--mandarine);color:#fff}
main{max-width:1280px;margin:0 auto;padding:24px 28px 48px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);border-left:5px solid var(--oregon)}
.kpi:nth-child(2){border-left-color:var(--mandarine)}.kpi:nth-child(3){border-left-color:var(--fougere)}.kpi:nth-child(4){border-left-color:var(--bleuclair)}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{background:var(--chip);border:1px solid transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text)}
.chip.on{background:var(--oregon);color:#fff}
.chip .n{opacity:.65;margin-left:6px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative;transition:transform .12s,box-shadow .12s;border-top:5px solid var(--c,var(--oregon))}
a.card{text-decoration:none;color:inherit}
a.card:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(31,42,55,.14)}
.cbody{padding:16px 16px 12px;display:flex;gap:12px;flex:1}
.ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;flex:none;background:color-mix(in srgb,var(--c,#3e5a7f) 16%,transparent)}
.ct{font-weight:700;font-size:15.5px;line-height:1.3}
.cd{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.4}
.cfoot{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.badge{background:var(--chip);border-radius:6px;padding:2px 8px;font-weight:600;color:var(--text)}
.dom{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{color:var(--c,var(--oregon));font-weight:700}
[data-theme="dark"] .go{color:var(--bleuclair)}
.card.hid{opacity:.5}
.card.hid::after{content:"Masquée";position:absolute;top:10px;right:10px;background:var(--muted);color:#fff;font-size:11px;padding:2px 8px;border-radius:6px}
.tools{display:flex;gap:4px;padding:8px 10px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--os) 30%,transparent);align-items:center}
[data-theme="dark"] .tools{background:rgba(255,255,255,.03)}
.tb{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:13px}
.tb:hover{border-color:var(--oregon)}
.tb.del:hover{border-color:#c0392b;color:#c0392b}
.sw{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-right:auto;cursor:pointer;user-select:none}
.sw input{display:none}
.sw span{width:34px;height:19px;border-radius:999px;background:#b9b3a6;position:relative;transition:.15s}
.sw span::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s}
.sw input:checked+span{background:var(--fougere)}
.sw input:checked+span::after{left:17px}
.card.drag{outline:2px dashed var(--mandarine)}
.add{border:2px dashed var(--line);border-radius:14px;display:grid;place-items:center;min-height:150px;cursor:pointer;color:var(--muted);font-weight:700;background:transparent}
.add:hover{border-color:var(--mandarine);color:var(--mandarine)}
.add b{display:block;font-size:30px;text-align:center}
.mbar{display:none;background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:12px 16px;margin-bottom:18px;gap:10px;align-items:center;flex-wrap:wrap;border-left:5px solid var(--mandarine)}
body.manage .mbar{display:flex}
.mbar .txt{flex:1;min-width:240px;font-size:13.5px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--oregon)}
.btn.pri{background:var(--oregon);border-color:var(--oregon);color:#fff}
.btn.warn:hover{border-color:#c0392b;color:#c0392b}
.empty{color:var(--muted);padding:30px;text-align:center;grid-column:1/-1}
dialog{border:none;border-radius:16px;padding:0;width:min(560px,94vw);background:var(--card);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,27,36,.55)}
.dh{background:var(--oregon);color:#fff;padding:14px 20px;font-weight:700;font-size:16px}
.db{padding:18px 20px;display:grid;gap:12px}
.db label{font-size:12.5px;font-weight:600;color:var(--muted);display:grid;gap:5px}
.db input,.db select,.db textarea{background:var(--input);border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;width:100%}
.db input:focus,.db textarea:focus,.db select:focus{border-color:var(--oregon)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.colors{display:flex;gap:8px}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.colors button.on{border-color:var(--text)}
.df{padding:12px 20px 18px;display:flex;justify-content:flex-end;gap:10px}
.err{color:#c0392b;font-size:12.5px;min-height:1em}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--oregon);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;font-weight:600}
.toast.show{opacity:1}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 0 26px}
@media(max-width:640px){header{padding:14px}main{padding:16px}.search{min-width:0;flex:1}.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">A</div>
  <div class="ttl"><h1>Portail Amicial</h1><div id="sub">Mes tableaux de bord et analyses</div></div>
  <div class="hspace"></div>
  <input class="search" id="q" type="search" placeholder="Rechercher une vignette…" aria-label="Rechercher">
  <button class="hbtn" id="bTheme" title="Mode clair / sombre">☾</button>
  <button class="hbtn" id="bManage">⚙ Gérer</button>
</header>

<main>
  <section class="kpis" id="kpis"></section>

  <section class="mbar">
    <div class="txt"><b>Mode gestion</b> — modifiez, masquez, réordonnez (glisser-déposer ou flèches) ou ajoutez des vignettes. Les réglages sont enregistrés dans ce navigateur.</div>
    <button class="btn pri" id="bAdd">+ Ajouter</button>
    <button class="btn" id="bExport">Exporter</button>
    <button class="btn" id="bImport">Importer</button>
    <button class="btn warn" id="bReset">Réinitialiser</button>
  </section>

  <nav class="chips" id="chips"></nav>
  <section class="grid" id="grid"></section>
</main>
<footer>Amicial · Pôle administratif – Contrôle de gestion</footer>

<!-- Édition d'une vignette -->
<dialog id="dEdit">
  <form id="fEdit" method="dialog">
    <div class="dh" id="dEditTitle">Vignette</div>
    <div class="db">
      <label>Titre *<input id="eTitle" required maxlength="80"></label>
      <label>Adresse (URL) *<input id="eUrl" required placeholder="https://…"></label>
      <label>Description<textarea id="eDesc" rows="2" maxlength="200"></textarea></label>
      <div class="row2">
        <label>Catégorie<input id="eCat" list="cats" placeholder="ex. Tableaux de bord"></label>
        <label>Icône (emoji)<input id="eIco" maxlength="4" placeholder="📊"></label>
      </div>
      <label>Couleur<div class="colors" id="eColors"></div></label>
      <label style="display:flex;align-items:center;gap:8px;flex-direction:row"><input type="checkbox" id="eVis" style="width:auto"> Afficher cette vignette</label>
      <div class="err" id="eErr"></div>
    </div>
    <div class="df">
      <button type="button" class="btn" id="eCancel">Annuler</button>
      <button type="submit" class="btn pri">Enregistrer</button>
    </div>
  </form>
</dialog>
<datalist id="cats"></datalist>

<!-- Export / import / confirmation -->
<dialog id="dIO">
  <div class="dh" id="ioTitle">Exporter</div>
  <div class="db">
    <div id="ioHelp" style="font-size:13px;color:var(--muted)"></div>
    <textarea id="ioText" rows="10" style="font-family:Consolas,monospace;font-size:12px"></textarea>
    <input type="file" id="ioFile" accept=".json,application/json">
    <div class="err" id="ioErr"></div>
  </div>
  <div class="df">
    <button class="btn" id="ioClose">Fermer</button>
    <button class="btn pri" id="ioAct">Copier</button>
  </div>
</dialog>
<dialog id="dConf">
  <div class="dh">Confirmation</div>
  <div class="db" id="cMsg"></div>
  <div class="df"><button class="btn" id="cNo">Annuler</button><button class="btn pri" id="cYes">Confirmer</button></div>
</dialog>
<div class="toast" id="toast"></div>

<script>
(function(){
const KEY="amicial-portail-v1";
const COLORS=[["#3e5a7f","Bleu Oregon"],["#f29559","Mandarine"],["#568259","Fougère"],["#8fb8bf","Bleu clair"],["#b3a77f","Os"]];
const DEFAULTS=[
 {title:"Tableau de bord Amicial",url:"https://claude.ai/artifact/73ZRtGooFhu6yfWgtrgtdh",desc:"Activité, objectifs, atterrissage, SIG, SSIAD, agences, salariés, modulation, trajets.",cat:"Tableaux de bord",icon:"📊",color:"#3e5a7f",visible:true},
 {title:"Tableau de bord directoire",url:"https://claude.ai/artifact/4Zz98nqGKJ2uP2V4HfvohC",desc:"Vue de synthèse pour le directoire.",cat:"Tableaux de bord",icon:"🧭",color:"#3e5a7f",visible:true},
 {title:"Budgets 2027 Amicial",url:"https://claude.ai/artifact/Vfqb3ie9Q4egFKhWADoX1p",desc:"Construction et suivi des budgets 2027.",cat:"Budgets",icon:"💶",color:"#568259",visible:true},
 {title:"Audit et devis paie compta",url:"https://claude.ai/artifact/Gf37cBpAEZ1MbMaFZQcygy",desc:"Audit et comparaison des devis paie / comptabilité.",cat:"Analyses",icon:"🧾",color:"#f29559",visible:true},
 {title:"Offre paie et comptabilité : vision mensuelle",url:"https://claude.ai/artifact/FKQsbN48oQHhUoqPVzykv1",desc:"Présentation de l'offre paie et comptabilité.",cat:"Présentations",icon:"📽️",color:"#8fb8bf",visible:true},
 {title:"Situation économique Amicial 2024-2026",url:"https://claude.ai/artifact/G75ci5J9NfV4TNoXAUfYzW",desc:"Présentation de la situation économique 2024-2026.",cat:"Présentations",icon:"📈",color:"#8fb8bf",visible:true},
 {title:"Tableau de bord Amicial TEST",url:"https://claude.ai/artifact/TWygea4gVdVLbWYazKJLpE",desc:"Version de test du tableau de bord.",cat:"Tableaux de bord",icon:"🧪",color:"#b3a77f",visible:false}
];
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const okUrl=u=>{try{const x=new URL(u);return x.protocol==="https:"||x.protocol==="http:"}catch(e){return false}};
const domain=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return ""}};

function load(){
  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.tiles))return o}}catch(e){}
  return {tiles:DEFAULTS.map(t=>({id:uid(),...t})),theme:null,updated:null};
}
let st=load(), manage=false, cat="Toutes", q="", editId=null;
function save(){st.updated=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800)}

// Thème
function applyTheme(){
  const dark=st.theme?st.theme==="dark":window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme=dark?"dark":"light";$("bTheme").textContent=dark?"☀":"☾";
}
$("bTheme").onclick=()=>{st.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";save();applyTheme()};

function cats(){return [...new Set(st.tiles.map(t=>t.cat||"Sans catégorie"))].sort((a,b)=>a.localeCompare(b,"fr"))}

function render(){
  const pool=st.tiles.filter(t=>manage||t.visible);
  const ql=q.trim().toLowerCase();
  const list=pool.filter(t=>(cat==="Toutes"||(t.cat||"Sans catégorie")===cat)&&(!ql||(t.title+" "+t.desc+" "+t.cat+" "+t.url).toLowerCase().includes(ql)));

  // KPI
  const vis=st.tiles.filter(t=>t.visible).length;
  const upd=st.updated?new Date(st.updated).toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"}):"—";
  $("kpis").innerHTML=
    `<div class="kpi"><div class="l">Vignettes affichées</div><div class="v">${vis}</div></div>
     <div class="kpi"><div class="l">Vignettes masquées</div><div class="v">${st.tiles.length-vis}</div></div>
     <div class="kpi"><div class="l">Catégories</div><div class="v">${cats().length}</div></div>
     <div class="kpi"><div class="l">Dernière modification</div><div class="v" style="font-size:17px;padding-top:5px">${upd}</div></div>`;

  // Chips
  const all=["Toutes",...new Set(pool.map(t=>t.cat||"Sans catégorie"))].filter((v,i,a)=>a.indexOf(v)===i);
  if(!all.includes(cat))cat="Toutes";
  const cnt=c=>c==="Toutes"?pool.length:pool.filter(t=>(t.cat||"Sans catégorie")===c).length;
  $("chips").innerHTML=all.map(c=>`<button class="chip${c===cat?" on":""}" data-c="${esc(c)}">${esc(c)}<span class="n">${cnt(c)}</span></button>`).join("");
  $("cats").innerHTML=cats().map(c=>`<option value="${esc(c)}">`).join("");

  // Grille
  const g=$("grid");
  let h=list.map(t=>{
    const inner=`<div class="cbody"><div class="ico">${esc(t.icon||"🔗")}</div><div><div class="ct">${esc(t.title)}</div>${t.desc?`<div class="cd">${esc(t.desc)}</div>`:""}</div></div>
      <div class="cfoot"><span class="badge">${esc(t.cat||"Sans catégorie")}</span><span class="dom">${esc(domain(t.url))}</span>${manage?"":`<span class="go">Ouvrir →</span>`}</div>`;
    if(!manage) return `<a class="card" style="--c:${esc(t.color)}" href="${esc(t.url)}" target="_blank" rel="noopener">${inner}</a>`;
    return `<div class="card${t.visible?"":" hid"}" style="--c:${esc(t.color)}" draggable="true" data-id="${t.id}">${inner}
      <div class="tools">
        <label class="sw" title="Afficher / masquer"><input type="checkbox" data-a="vis" ${t.visible?"checked":""}><span></span>${t.visible?"Affichée":"Masquée"}</label>
        <button class="tb" data-a="up" title="Monter">↑</button><button class="tb" data-a="down" title="Descendre">↓</button>
        <button class="tb" data-a="edit" title="Modifier">✎</button><button class="tb del" data-a="del" title="Supprimer">🗑</button>
      </div></div>`;
  }).join("");
  if(!list.length&&!manage) h=`<div class="empty">Aucune vignette ne correspond. ${st.tiles.length?"":"Passez en mode « Gérer » pour en ajouter."}</div>`;
  if(manage) h+=`<button class="add" id="addTile"><span><b>+</b>Ajouter une vignette</span></button>`;
  g.innerHTML=h;
  $("bManage").classList.toggle("on",manage);
  $("bManage").textContent=manage?"✓ Terminer":"⚙ Gérer";
  document.body.classList.toggle("manage",manage);
}

$("chips").onclick=e=>{const b=e.target.closest(".chip");if(b){cat=b.dataset.c;render()}};
$("q").oninput=e=>{q=e.target.value;render()};
$("bManage").onclick=()=>{manage=!manage;render()};

// Actions des vignettes
const idx=id=>st.tiles.findIndex(t=>t.id===id);
$("grid").addEventListener("click",e=>{
  if(e.target.closest("#addTile")){openEdit(null);return}
  const b=e.target.closest("[data-a]");if(!b||b.dataset.a==="vis")return;
  const id=b.closest(".card").dataset.id,i=idx(id),a=b.dataset.a;
  if(a==="edit")openEdit(id);
  if(a==="up"&&i>0){[st.tiles[i-1],st.tiles[i]]=[st.tiles[i],st.tiles[i-1]];save();render()}
  if(a==="down"&&i<st.tiles.length-1){[st.tiles[i+1],st.tiles[i]]=[st.tiles[i],st.tiles[i+1]];save();render()}
  if(a==="del")confirmBox(`Supprimer la vignette « ${esc(st.tiles[i].title)} » ?`,()=>{st.tiles.splice(i,1);save();render();toast("Vignette supprimée")});
});
$("grid").addEventListener("change",e=>{
  if(e.target.dataset.a!=="vis")return;
  const t=st.tiles[idx(e.target.closest(".card").dataset.id)];t.visible=e.target.checked;save();render();
});
// Glisser-déposer
let dragId=null;
$("grid").addEventListener("dragstart",e=>{const c=e.target.closest(".card[data-id]");if(c){dragId=c.dataset.id;e.dataTransfer.effectAllowed="move"}});
$("grid").addEventListener("dragover",e=>{const c=e.target.closest(".card[data-id]");if(c&&dragId){e.preventDefault();document.querySelectorAll(".card.drag").forEach(x=>x.classList.remove("drag"));c.classList.add("drag")}});
$("grid").addEventListener("drop",e=>{
  const c=e.target.closest(".card[data-id]");if(!c||!dragId)return;e.preventDefault();
  const from=idx(dragId),to=idx(c.dataset.id);
  if(from>-1&&to>-1&&from!==to){const [m]=st.tiles.splice(from,1);st.tiles.splice(to,0,m);save()}
  dragId=null;render();
});
$("grid").addEventListener("dragend",()=>{dragId=null;document.querySelectorAll(".card.drag").forEach(x=>x.classList.remove("drag"))});

// Formulaire
let pickColor=COLORS[0][0];
function drawColors(){$("eColors").innerHTML=COLORS.map(([c,n])=>`<button type="button" title="${n}" data-c="${c}" style="background:${c}" class="${c===pickColor?"on":""}"></button>`).join("")}
$("eColors").onclick=e=>{const b=e.target.closest("button");if(b){pickColor=b.dataset.c;drawColors()}};
function openEdit(id){
  editId=id;const t=id?st.tiles[idx(id)]:{title:"",url:"https://",desc:"",cat:cat!=="Toutes"?cat:"",icon:"📊",color:COLORS[0][0],visible:true};
  $("dEditTitle").textContent=id?"Modifier la vignette":"Nouvelle vignette";
  $("eTitle").value=t.title;$("eUrl").value=t.url;$("eDesc").value=t.desc||"";$("eCat").value=t.cat||"";$("eIco").value=t.icon||"";$("eVis").checked=t.visible;
  pickColor=t.color||COLORS[0][0];drawColors();$("eErr").textContent="";
  $("dEdit").showModal();$("eTitle").focus();
}
$("eCancel").onclick=()=>$("dEdit").close();
$("fEdit").onsubmit=e=>{
  e.preventDefault();
  const url=$("eUrl").value.trim(),title=$("eTitle").value.trim();
  if(!title){$("eErr").textContent="Le titre est obligatoire.";return}
  if(!okUrl(url)){$("eErr").textContent="Adresse invalide : elle doit commencer par https:// (ou http://).";return}
  const d={title,url,desc:$("eDesc").value.trim(),cat:$("eCat").value.trim()||"Sans catégorie",icon:$("eIco").value.trim()||"🔗",color:pickColor,visible:$("eVis").checked};
  if(editId)Object.assign(st.tiles[idx(editId)],d);else st.tiles.push({id:uid(),...d});
  save();$("dEdit").close();render();toast(editId?"Vignette modifiée":"Vignette ajoutée");
};
$("bAdd").onclick=()=>openEdit(null);

// Confirmation
let confCb=null;
function confirmBox(msg,cb){$("cMsg").innerHTML=msg;confCb=cb;$("dConf").showModal()}
$("cNo").onclick=()=>$("dConf").close();
$("cYes").onclick=()=>{$("dConf").close();confCb&&confCb()};

// Export / import
let ioMode="export";
function openIO(mode){
  ioMode=mode;$("ioErr").textContent="";
  const ex=mode==="export";
  $("ioTitle").textContent=ex?"Exporter la configuration":"Importer une configuration";
  $("ioHelp").textContent=ex?"Copiez ce texte (ou enregistrez-le dans un fichier .json) pour sauvegarder vos vignettes ou les transférer sur un autre poste.":"Collez une configuration exportée, ou choisissez un fichier .json. Elle remplacera les vignettes actuelles.";
  $("ioText").value=ex?JSON.stringify({tiles:st.tiles.map(({id,...t})=>t)},null,2):"";
  $("ioText").readOnly=ex;$("ioFile").style.display=ex?"none":"block";$("ioFile").value="";
  $("ioAct").textContent=ex?"Copier":"Importer";
  $("dIO").showModal();
}
$("bExport").onclick=()=>openIO("export");
$("bImport").onclick=()=>openIO("import");
$("ioClose").onclick=()=>$("dIO").close();
$("ioFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("ioText").value=r.result};r.readAsText(f)};
$("ioAct").onclick=async()=>{
  if(ioMode==="export"){
    try{await navigator.clipboard.writeText($("ioText").value);toast("Configuration copiée")}
    catch(e){$("ioText").select();$("ioErr").textContent="Copie automatique refusée : utilisez Ctrl+C sur le texte sélectionné."}
    return;
  }
  try{
    const o=JSON.parse($("ioText").value);const arr=Array.isArray(o)?o:o.tiles;
    if(!Array.isArray(arr))throw 0;
    const tiles=arr.filter(t=>t&&t.title&&okUrl(t.url)).map(t=>({id:uid(),title:String(t.title),url:String(t.url),desc:String(t.desc||""),cat:String(t.cat||"Sans catégorie"),icon:String(t.icon||"🔗"),color:String(t.color||COLORS[0][0]),visible:t.visible!==false}));
    if(!tiles.length)throw 0;
    st.tiles=tiles;save();$("dIO").close();render();toast(tiles.length+" vignettes importées");
  }catch(e){$("ioErr").textContent="Configuration illisible : vérifiez le format JSON (titre et URL https obligatoires)."}
};
$("bReset").onclick=()=>confirmBox("Revenir à la liste de vignettes d'origine ? Vos modifications seront perdues.",()=>{st.tiles=DEFAULTS.map(t=>({id:uid(),...t}));save();render();toast("Liste réinitialisée")});

$("sub").textContent="Mes tableaux de bord et analyses · "+new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
applyTheme();render();
})();
</script>
</body>
</html>
